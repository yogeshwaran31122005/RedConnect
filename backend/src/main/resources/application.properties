spring.application.name=redconnect
server.port=${SERVER_PORT:8080}

# SQLite - embedded database, no server to install. Creates redconnect.db automatically.
spring.datasource.url=${DB_URL:jdbc:sqlite:redconnect.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Jackson
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=${JWT_SECRET:redconnect-capstone-change-this-secret-key-to-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - allow React dev server
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
