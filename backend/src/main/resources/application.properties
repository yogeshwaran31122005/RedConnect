spring.application.name=redconnect
# Render injects $PORT (defaults to 10000). Locally defaults to 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL - production database (line-by-line rows are stored in the Postgres tables)
# Real credentials come from env vars (local backend/.env - gitignored, or Render Environment).
# Defaults below are safe placeholders for open-source commits.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/redconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (PostgreSQL dialect is detected automatically)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Jackson
spring.jackson.default-property-inclusion=non_null

# JWT
app.jwt.secret=${JWT_SECRET:redconnect-capstone-change-this-secret-key-to-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - allow React dev server
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Mailtrap - admin OTP email
app.mailtrap.api-key=${MAILTRAP_API_KEY:e936a62974fe6b09084ec1a88f771e5c}
app.mailtrap.from-email=${MAILTRAP_FROM_EMAIL:hello@demomailtrap.co}
app.mailtrap.from-name=${MAILTRAP_FROM_NAME:RedConnect Admin}
app.admin.otp-expiry-minutes=${ADMIN_OTP_EXPIRY:5}