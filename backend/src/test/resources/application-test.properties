# Tests use H2 running in PostgreSQL compatibility mode (in-memory, no server needed).
# Production runs on PostgreSQL - behaviour is identical for these tests.
spring.datasource.url=jdbc:h2:mem:redconnect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-signing-purposes-1234567890
app.jwt.expiration-ms=3600000