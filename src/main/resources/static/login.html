<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RedConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="glass-body">

    <!-- Decorative blurred orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="glass-card">
        <div class="glass-brand">
            <span class="drop">🩸</span>
            <h1>RedConnect</h1>
            <p>Donate Blood, Save Lives</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">User ID (Email)</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                       autocomplete="email" autofocus>
                <small class="error-msg" id="emailError"></small>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"
                       autocomplete="current-password">
                <small class="error-msg" id="passwordError"></small>
            </div>

            <div class="error-msg form-error" id="formError"></div>

            <button type="submit" class="btn-glass btn-primary" id="loginBtn">Login</button>
        </form>

        <div class="divider"><span>New to RedConnect?</span></div>

        <button type="button" class="btn-glass btn-ghost" id="createUserBtn">Create New User</button>

        <p class="logged-in" id="loggedIn" hidden>
            ✅ Logged in as <strong id="loggedInEmail"></strong>
            <button type="button" class="link-btn" id="logoutBtn">Logout</button>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
